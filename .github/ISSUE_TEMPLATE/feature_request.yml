name: "✨ Feature request / 功能建议"
description: Propose a concrete improvement to OpenInterview
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the user or engineering problem before proposing a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What behavior, API, workflow, or interface should change?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What simpler or existing approaches did you consider?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Resume parsing
        - Question generation
        - Interview / speech pipeline
        - Report generation
        - Worker orchestration
        - Web UI
        - Deployment / operations
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the change complete and testable.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
