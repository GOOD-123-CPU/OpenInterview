name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        working-directory: app
        run: pip install ruff

      - name: Lint
        working-directory: app
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies (without heavy ML packages)
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          grep -vE "^(torch|openai-whisper)" requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt

      - name: Syntax check all Python files
        working-directory: app
        run: python -m compileall -q . -x "venv|__pycache__"

      - name: Run pytest suite (mock heavy deps)
        working-directory: app
        env:
          ADMIN_PASSWORD: test-admin-pw
          OPENAI_API_KEY: dummy-key-for-ci
        run: pytest tests/ -v --tb=short
