name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        working-directory: app
        run: pip install ruff

      - name: Lint
        working-directory: app
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies (without heavy ML packages)
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          grep -vE "^(torch|openai-whisper)" requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt

      - name: Syntax check all Python files
        working-directory: app
        run: python -m compileall -q . -x "venv|__pycache__"

      - name: Run pytest suite (mock heavy deps)
        working-directory: app
        env:
          ADMIN_PASSWORD: test-admin-pw
          OPENAI_API_KEY: dummy-key-for-ci
        run: pytest tests/ -v --tb=short


  format-task-lease:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/worker-task-leases'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Apply repository Ruff import formatting
        working-directory: app
        run: |
          pip install ruff
          ruff check services/task_lease.py --fix

      - name: Commit Ruff-generated change when needed
        run: |
          if git diff --quiet -- app/services/task_lease.py; then
            echo "Ruff reports no generated change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/task_lease.py
          git commit -m "style: apply repository ruff formatting"
          git push origin HEAD:${{ github.head_ref }}
