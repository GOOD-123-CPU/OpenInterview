<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · OpenInterview</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6fa; --card: #ffffff; --text: #1c2333; --muted: #6b7280;
      --primary: #2f6bff; --primary-dark: #1e4fd6; --border: #e5e8ef;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12141c; --card: #1c1f2b; --text: #e8eaf0; --muted: #9aa1b0;
              --primary: #5b8cff; --primary-dark: #3e6ef0; --border: #2a2e3d; }
    }
    * { transition: background-color .2s, color .2s, border-color .2s; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    }
    .login-card {
      width: 100%; max-width: 400px; background: var(--card);
      border: 1px solid var(--border); border-radius: 16px; padding: 40px 36px;
    }
    .logo { width: 52px; height: 52px; border-radius: 14px; background: var(--primary);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
    .logo svg { width: 28px; height: 28px; }
    h1 { font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 28px; }
    label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .form-control {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 11px 14px; font-size: 14px;
    }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
    .btn-primary {
      background: var(--primary); border: none; border-radius: 10px;
      padding: 11px; font-size: 14px; font-weight: 500; width: 100%; margin-top: 18px;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: .6; }
    .error-msg { color: #e5484d; font-size: 13px; text-align: center; min-height: 20px; margin-top: 12px; }
    .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <path d="M12 2a4 4 0 0 1 4 4v5a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/>
        <path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/>
      </svg>
    </div>
    <h1>OpenInterview 管理控制台</h1>
    <div class="sub">AI 智能面试系统 · v2.0</div>
    <form onsubmit="return doLogin(event)">
      <div class="mb-3">
        <label for="pwd">管理员口令</label>
        <input type="password" class="form-control" id="pwd" autocomplete="current-password" autofocus>
      </div>
      <button class="btn btn-primary" id="btn" type="submit">登 录</button>
      <div class="error-msg" id="err"></div>
    </form>
    <div class="hint">首次部署？初始口令见服务启动日志，或由 ADMIN_PASSWORD 环境变量指定</div>
  </div>

  <script>
    // 已登录直接跳转
    if (sessionStorage.getItem('oi_token') || localStorage.getItem('oi_token')) {
      location.href = 'admin.html';
    }
    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      err.textContent = '';
      btn.disabled = true; btn.textContent = '登录中…';
      try {
        const base = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
          ? 'http://localhost:8000/' : location.origin + '/';
        const r = await fetch(base + 'api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('pwd').value })
        });
        const j = await r.json();
        if (!r.ok) { err.textContent = j.error || '登录失败'; return false; }
        localStorage.setItem('oi_token', j.token);
        location.href = 'admin.html';
      } catch (ex) {
        err.textContent = '网络错误，请确认服务已启动';
      } finally {
        btn.disabled = false; btn.textContent = '登 录';
      }
      return false;
    }
  </script>
</body>
</html>
