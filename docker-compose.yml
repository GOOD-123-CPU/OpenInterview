services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ./app/.env
    restart: unless-stopped

  # 生产环境反向代理（可选）：
  # 需要 HTTPS 时，将证书放入 nginx/ssl/（server.pem / server.key），
  # 修改 nginx/nginx.conf 中的 server_name 后取消下方注释。
  #
  # nginx:
  #   image: nginx:latest
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - ./app:/app:ro
  #   depends_on:
  #     - app
